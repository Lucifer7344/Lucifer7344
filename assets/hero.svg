<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="0.55" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#12355B"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7DD3FC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" x2="1">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7DD3FC" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .up{opacity:0;animation:up 0.9s ease-out forwards}
    .d1{animation-delay:0.15s}.d2{animation-delay:0.45s}.d3{animation-delay:0.75s}.d4{animation-delay:1.05s}.d5{animation-delay:1.35s}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .floatA{animation:floatA 11s ease-in-out infinite}
    .floatB{animation:floatB 13s ease-in-out infinite}
    @keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,25px)}}
    @keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-20px)}}
    .beam{animation:beam 5s linear infinite}
    @keyframes beam{from{transform:translateX(-400px)}to{transform:translateX(1400px)}}
    .flow{stroke-dasharray:5 9;animation:flow 2.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-56}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .p2{animation-delay:0.6s}.p3{animation-delay:1.2s}.p4{animation-delay:1.8s}
    @keyframes pulse{0%,100%{opacity:0.45}50%{opacity:1}}
    .blink{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="floatA" cx="980" cy="70" r="220" fill="url(#orbA)"/>
    <circle class="floatB" cx="180" cy="300" r="200" fill="url(#orbB)"/>
    <rect class="beam" x="0" y="0" width="300" height="340" fill="url(#beam)"/>

    <!-- network motif -->
    <g stroke="#7DD3FC" stroke-width="1.6" fill="none" opacity="0.8">
      <path class="flow" d="M1010 90 L900 170"/>
      <path class="flow" d="M1010 90 L1110 180"/>
      <path class="flow" d="M900 170 L960 260"/>
      <path class="flow" d="M1110 180 L960 260"/>
      <path class="flow" d="M900 170 L1110 180"/>
      <path class="flow" d="M1010 90 L960 260"/>
    </g>
    <g fill="#7DD3FC">
      <circle class="pulse" cx="1010" cy="90" r="9"/>
      <circle class="pulse p2" cx="900" cy="170" r="7"/>
      <circle class="pulse p3" cx="1110" cy="180" r="7"/>
      <circle class="pulse p4" cx="960" cy="260" r="8"/>
    </g>
    <circle cx="1010" cy="90" r="18" fill="none" stroke="#7DD3FC" stroke-opacity="0.35"/>

    <!-- copy -->
    <g class="up d1">
      <rect x="80" y="70" width="190" height="30" rx="15" fill="#7DD3FC" fill-opacity="0.12" stroke="#7DD3FC" stroke-opacity="0.5"/>
      <circle class="pulse" cx="100" cy="85" r="5" fill="#34D399"/>
      <text x="114" y="90.5" font-size="14" font-weight="700" letter-spacing="2.5" fill="#7DD3FC">FOUNDER &amp; CEO</text>
    </g>
    <text class="up d2" x="78" y="168" font-size="66" font-weight="800" letter-spacing="3" fill="url(#nameFill)">HARSHIT KATIYAR</text>
    <text class="up d3" x="80" y="212" font-size="24" fill="#CBD5E1">Alberoz Group  <tspan fill="#7DD3FC">·</tspan>  Albero Technologies<tspan class="blink" fill="#7DD3FC"> _</tspan></text>

    <g class="up d4" font-size="15" font-weight="600" text-anchor="middle" fill="#E2E8F0">
      <rect x="80" y="246" width="90" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#7DD3FC" stroke-opacity="0.35"/>
      <text x="125" y="268">SaaS</text>
      <rect x="182" y="246" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#7DD3FC" stroke-opacity="0.35"/>
      <text x="270" y="268">Custom Software</text>
      <rect x="370" y="246" width="128" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#7DD3FC" stroke-opacity="0.35"/>
      <text x="434" y="268">AI Systems</text>
      <rect x="510" y="246" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#7DD3FC" stroke-opacity="0.35"/>
      <text x="562" y="268">EdTech</text>
    </g>
    <text class="up d5" x="80" y="315" font-size="13" letter-spacing="1.5" fill="#64748B">BUILDING WHAT BUSINESSES RUN ON  ·  INDIA</text>
  </g>
</svg>
