<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<defs><linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1F3A"/><stop offset="1" stop-color="#081426"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/><stop offset="0.5" stop-color="#7DD3FC"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></linearGradient></defs>
<style>
.in{opacity:0;animation:in .7s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.sweep{animation:sweep 3.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-120px)}100%{transform:translateX(300px)}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.8}}
</style>
<g transform="translate(15,20)"><g class="in" style="animation-delay:0.00s">
<clipPath id="c0"><rect width="270" height="150" rx="16"/></clipPath>
<rect width="270" height="150" rx="16" fill="url(#cardbg)" stroke="#7DD3FC" class="glow" style="animation-delay:0.00s"/>
<g clip-path="url(#c0)"><rect class="sweep" style="animation-delay:0.00s" x="0" y="0" width="120" height="3" fill="url(#shine)"/></g>
<circle cx="40" cy="42" r="20" fill="#7DD3FC" fill-opacity="0.14" stroke="#7DD3FC" stroke-opacity="0.6"/>
<text x="40" y="48" text-anchor="middle" font-size="15" font-weight="800" fill="#7DD3FC">C</text>
<text x="72" y="49" font-size="21" font-weight="700" fill="#F5F7FA">CRM Pro</text>
