<text x="40" y="48" text-anchor="middle" font-size="13" font-weight="800" fill="#7DD3FC">AI</text>
<text x="72" y="49" font-size="21" font-weight="700" fill="#F5F7FA">AI Lab Setup</text>
<text x="22" y="98" font-size="14.5" fill="#94A3B8">FutureTech AI &amp; Robotics</text>
<text x="22" y="120" font-size="14.5" fill="#94A3B8">Labs for schools</text>
